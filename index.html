<!DOCTYPE html>
<html>
<head>
<base target="_top">
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#F4F6F5;
    --panel:#FFFFFF;
    --panel-2:#EEF1F0;
    --hairline:#DCE1DF;
    --text:#1B2321;
    --text-dim:#657270;
    --accent:#1F5C5C;
    --accent-soft:rgba(31,92,92,0.08);
    --accent-line:rgba(31,92,92,0.30);
    --good:#2F7D5C;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--text);}
  body{
    font-family:'Inter',sans-serif;
    min-height:100vh;
    position:relative;
    overflow-x:hidden;
  }

  /* ambient grid */
  .grid-field{
    position:fixed;inset:0;z-index:0;pointer-events:none;
    background-image:
      linear-gradient(var(--hairline) 1px, transparent 1px),
      linear-gradient(90deg, var(--hairline) 1px, transparent 1px);
    background-size:64px 64px;
    opacity:0.55;
    mask-image:radial-gradient(ellipse 80% 60% at 50% 0%, black 35%, transparent 88%);
    animation:driftGrid 60s linear infinite;
  }
  @keyframes driftGrid{
    from{background-position:0 0, 0 0;}
    to{background-position:64px 128px, 64px 128px;}
  }
  .glow{
    position:fixed;top:-25%;left:50%;transform:translateX(-50%);
    width:1000px;height:1000px;z-index:0;pointer-events:none;
    background:radial-gradient(circle, rgba(31,92,92,0.09) 0%, transparent 60%);
  }

  /* signature element: slow-rotating instrument dial, ambient behind hero */
  .dial-field{
    position:fixed;top:60px;right:-220px;z-index:0;pointer-events:none;
    width:560px;height:560px;opacity:0.5;
  }
  .dial-field svg{width:100%;height:100%;animation:dialSpin 140s linear infinite;}
  @keyframes dialSpin{from{transform:rotate(0deg);} to{transform:rotate(360deg);}}
  .dial-field .tick{stroke:var(--hairline);}
  .dial-field .tick-major{stroke:var(--accent-line);}
  .dial-field .ring{stroke:var(--hairline);}

  header.topbar{
    position:relative;z-index:2;
    display:flex;align-items:center;gap:16px;
    padding:22px 32px;
    border-bottom:1px solid var(--hairline);
    background:linear-gradient(180deg, rgba(244,246,245,0.94), rgba(244,246,245,0.72));
    backdrop-filter:blur(6px);
    opacity:0;
    animation:fadeDown 0.7s ease forwards;
  }
  @keyframes fadeDown{
    from{opacity:0; transform:translateY(-10px);}
    to{opacity:1; transform:translateY(0);}
  }
  .logo-chip{
    width:44px;height:44px;border-radius:10px;
    background:#FFFFFF;
    border:1px solid var(--hairline);
    display:flex;align-items:center;justify-content:center;
    flex-shrink:0;
    box-shadow:0 2px 8px rgba(31,92,92,0.08);
  }
  .logo-chip img{width:28px;height:28px;object-fit:contain;}
  .brand-text{display:flex;flex-direction:column;line-height:1.15;}
  .brand-text .org{
    font-family:'Space Grotesk',sans-serif;
    font-weight:700;font-size:16px;letter-spacing:0.02em;color:var(--text);
  }
  .brand-text .sub{
    font-family:'JetBrains Mono',monospace;
    font-size:10.5px;letter-spacing:0.16em;text-transform:uppercase;color:var(--accent);
    margin-top:2px;
  }
  .topbar-right{
    margin-left:auto;font-family:'JetBrains Mono',monospace;font-size:11px;
    color:var(--text-dim); letter-spacing:0.08em;
    display:flex;align-items:center;gap:8px;
  }
  .pulse-dot{
    width:6px;height:6px;border-radius:50%;background:var(--good);
    box-shadow:0 0 0 0 rgba(124,154,130,0.6);
    animation:pulse 2.2s infinite;
  }
  @keyframes pulse{
    0%{box-shadow:0 0 0 0 rgba(124,154,130,0.5);}
    70%{box-shadow:0 0 0 8px rgba(124,154,130,0);}
    100%{box-shadow:0 0 0 0 rgba(124,154,130,0);}
  }

  main{
    position:relative;z-index:1;
    max-width:760px;margin:0 auto;
    padding:56px 24px 120px;
  }

  .eyebrow{
    font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:0.18em;
    text-transform:uppercase;color:var(--accent);margin-bottom:14px;
    opacity:0; animation:riseIn 0.6s ease 0.15s forwards;
  }
  h1.study-title{
    font-family:'Space Grotesk',sans-serif;font-weight:700;
    font-size:clamp(28px,4.4vw,42px);line-height:1.08;margin:0 0 10px;
    opacity:0; animation:riseIn 0.6s ease 0.28s forwards;
  }
  p.study-sub{
    color:var(--text-dim);font-size:15px;line-height:1.6;max-width:560px;margin:0 0 6px;
    opacity:0; animation:riseIn 0.6s ease 0.4s forwards;
  }
  p.study-desc{
    color:var(--text-dim);font-size:13.5px;line-height:1.6;max-width:560px;margin:14px 0 0;
    opacity:0; animation:riseIn 0.6s ease 0.5s forwards;
  }
  @keyframes riseIn{
    from{opacity:0; transform:translateY(14px);}
    to{opacity:1; transform:translateY(0);}
  }

  /* instrument rail */
  .rail{
    display:flex;align-items:center;gap:0;margin:40px 0 8px;
    opacity:0; animation:riseIn 0.6s ease 0.6s forwards;
  }
  .rail-step{
    display:flex;flex-direction:column;align-items:center;gap:8px;flex:1;position:relative;
  }
  .rail-line{
    position:absolute;top:6px;left:-50%;width:100%;height:1px;background:var(--hairline);z-index:0;
  }
  .rail-step:first-child .rail-line{display:none;}
  .rail-line-fill{
    position:absolute;top:0;left:0;height:100%;width:0%;background:var(--accent);
    transition:width 0.5s ease;
  }
  .rail-tick{
    width:13px;height:13px;border-radius:50%;border:1.5px solid var(--hairline);
    background:var(--panel);z-index:1;transition:all 0.35s ease;
  }
  .rail-tick.done{background:var(--accent);border-color:var(--accent);}
  .rail-tick.current{
    border-color:var(--accent);box-shadow:0 0 0 4px var(--accent-soft);
    transform:scale(1.15);
  }
  .rail-label{
    font-family:'JetBrains Mono',monospace;font-size:9.5px;letter-spacing:0.08em;
    text-transform:uppercase;color:var(--text-dim);text-align:center;
  }
  .rail-label.current{color:var(--accent);}

  .panel{
    background:var(--panel);
    border:1px solid var(--hairline);
    border-radius:14px;
    padding:36px 32px;
    margin-top:28px;
    position:relative;
    overflow:hidden;
  }
  .panel::before{
    content:"";position:absolute;top:0;left:0;right:0;height:1px;
    background:linear-gradient(90deg, transparent, var(--accent-line), transparent);
  }
  .section-code{
    font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--accent);
    letter-spacing:0.14em;text-transform:uppercase;margin-bottom:6px;
  }
  .section-title{
    font-family:'Space Grotesk',sans-serif;font-weight:600;font-size:20px;margin:0 0 24px;
  }

  .field{margin-bottom:26px; opacity:0; transform:translateY(10px); animation:qIn 0.5s ease forwards;}
  @keyframes qIn{ to{opacity:1; transform:translateY(0);} }
  .field-label{
    font-size:14.5px;line-height:1.55;margin-bottom:12px;color:var(--text);
  }
  .field-label .qid{
    font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--text-dim);margin-right:8px;
  }

  select, input[type=number], input[type=text]{
    width:100%;padding:12px 14px;background:var(--panel-2);
    border:1px solid var(--hairline);border-radius:8px;color:var(--text);
    font-family:'Inter',sans-serif;font-size:14px;
    transition:border-color 0.2s ease;
  }
  select:focus, input:focus{outline:none;border-color:var(--accent);}

  .check-row{display:flex;flex-wrap:wrap;gap:10px;}
  .check-pill{
    padding:9px 14px;border-radius:20px;border:1px solid var(--hairline);
    background:var(--panel-2);font-size:13px;cursor:pointer;user-select:none;
    transition:all 0.18s ease;color:var(--text-dim);
  }
  .check-pill:hover{border-color:var(--accent-line);}
  .check-pill.active{
    background:var(--accent-soft);border-color:var(--accent);color:var(--text);
  }

  .likert-row{display:flex;gap:8px;justify-content:space-between;}
  .likert-opt{
    flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;
    padding:10px 4px;border-radius:9px;border:1px solid var(--hairline);
    background:var(--panel-2);cursor:pointer;transition:all 0.18s ease;
  }
  .likert-opt:hover{border-color:var(--accent-line);}
  .likert-opt.active{border-color:var(--accent);background:var(--accent-soft);}
  .likert-num{font-family:'JetBrains Mono',monospace;font-size:13px;color:var(--text);}
  .likert-dot{width:16px;height:16px;border-radius:50%;border:1.5px solid var(--hairline);}
  .likert-opt.active .likert-dot{background:var(--accent);border-color:var(--accent);}
  .likert-scale-labels{
    display:flex;justify-content:space-between;margin-top:6px;
    font-size:10px;color:var(--text-dim);font-family:'JetBrains Mono',monospace;
  }

  .nav-row{
    display:flex;justify-content:space-between;align-items:center;margin-top:32px;
  }
  button{
    font-family:'Inter',sans-serif;font-weight:600;font-size:14px;
    padding:13px 26px;border-radius:9px;border:1px solid var(--hairline);
    background:transparent;color:var(--text-dim);cursor:pointer;
    transition:all 0.2s ease;
  }
  button.primary{
    background:var(--accent);color:#F4F6F5;border-color:var(--accent);
  }
  button.primary:hover{filter:brightness(1.08);}
  button.ghost:hover{border-color:var(--accent-line);color:var(--text);}
  button:disabled{opacity:0.35;cursor:not-allowed;}

  .loading, .done-screen, .error-screen{
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    text-align:center;padding:120px 20px;gap:18px;
  }
  .spinner{
    width:28px;height:28px;border-radius:50%;
    border:2px solid var(--hairline);border-top-color:var(--accent);
    animation:spin 0.8s linear infinite;
  }
  @keyframes spin{to{transform:rotate(360deg);}}
  .done-mark{
    width:64px;height:64px;border-radius:50%;
    border:2px solid var(--good);display:flex;align-items:center;justify-content:center;
    animation:popIn 0.5s cubic-bezier(.2,1.4,.4,1) forwards;
  }
  @keyframes popIn{from{transform:scale(0.4);opacity:0;} to{transform:scale(1);opacity:1;}}
  .done-title{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:22px;}
  .done-sub{color:var(--text-dim);font-size:14px;max-width:400px;}

  @media (max-width:600px){
    .panel{padding:26px 18px;}
    .rail-label{display:none;}
    .likert-row{flex-wrap:wrap;}
  }

  @media (prefers-reduced-motion: reduce){
    *{animation-duration:0.01ms !important; animation-iteration-count:1 !important;}
  }
</style>
</head>
<body>

<div class="grid-field"></div>
<div class="glow"></div>
<div class="dial-field" aria-hidden="true">
  <svg viewBox="0 0 560 560" fill="none">
    <circle class="ring" cx="280" cy="280" r="230" stroke-width="1"/>
    <circle class="ring" cx="280" cy="280" r="180" stroke-width="1"/>
    <g id="ticks"></g>
  </svg>
</div>
<script>
(function(){
  var g = document.getElementById('ticks');
  var cx=280, cy=280, r1=230, r2=180;
  for(var i=0;i<36;i++){
    var angle = (i/36) * Math.PI * 2;
    var major = i % 3 === 0;
    var inner = major ? r1-18 : r1-9;
    var x1 = cx + Math.cos(angle)*r1, y1 = cy + Math.sin(angle)*r1;
    var x2 = cx + Math.cos(angle)*inner, y2 = cy + Math.sin(angle)*inner;
    var line = document.createElementNS('http://www.w3.org/2000/svg','line');
    line.setAttribute('x1',x1);line.setAttribute('y1',y1);
    line.setAttribute('x2',x2);line.setAttribute('y2',y2);
    line.setAttribute('class', major ? 'tick-major' : 'tick');
    line.setAttribute('stroke-width', major ? '1.4' : '1');
    g.appendChild(line);
  }
})();
</script>

<header class="topbar">
  <div class="logo-chip"><img src="data:image/png;base64,<?= logoBase64 ?>" alt="OMAC"></div>
  <div class="brand-text">
    <span class="org">OMAC International</span>
    <span class="sub">Research Forum</span>
  </div>
  <div class="topbar-right"><span class="pulse-dot"></span>LIVE INSTRUMENT</div>
</header>

<main id="app">
  <div class="loading">
    <div class="spinner"></div>
    <p style="color:var(--text-dim);font-family:'JetBrains Mono',monospace;font-size:12px;letter-spacing:0.08em;">LOADING ACTIVE STUDY…</p>
  </div>
</main>

<script>
let SCHEMA = null;
let currentSectionIndex = 0;
let answers = {};

function boot(){
  google.script.run.withSuccessHandler(onSchemaLoaded).withFailureHandler(onLoadError).getActiveQuestionnaire();
}

function onLoadError(err){
  document.getElementById('app').innerHTML =
    '<div class="error-screen"><p style="font-family:\'Space Grotesk\',sans-serif;font-size:20px;">No active study</p>' +
    '<p style="color:var(--text-dim);font-size:14px;">' + (err && err.message ? err.message : 'Please check back later.') + '</p></div>';
}

function onSchemaLoaded(schema){
  if(!schema){ onLoadError({message:'There is no open questionnaire right now.'}); return; }
  SCHEMA = schema;
  currentSectionIndex = 0;
  answers = {};
  renderShell();
}

function renderShell(){
  const app = document.getElementById('app');
  app.innerHTML =
    '<div class="eyebrow">' + escapeHtml(SCHEMA.eyebrow || 'Active Study') + '</div>' +
    '<h1 class="study-title">' + escapeHtml(SCHEMA.title) + '</h1>' +
    '<p class="study-sub">' + escapeHtml(SCHEMA.subtitle || '') + '</p>' +
    (SCHEMA.description ? '<p class="study-desc">' + escapeHtml(SCHEMA.description) + '</p>' : '') +
    '<div class="rail" id="rail"></div>' +
    '<div class="panel" id="panel"></div>';
  renderRail();
  renderSection();
}

function renderRail(){
  const rail = document.getElementById('rail');
  rail.innerHTML = SCHEMA.sections.map((s, i) => {
    const state = i < currentSectionIndex ? 'done' : (i === currentSectionIndex ? 'current' : '');
    const fillWidth = i <= currentSectionIndex ? '100%' : '0%';
    return '<div class="rail-step">' +
      '<div class="rail-line"><div class="rail-line-fill" style="width:' + (i===0?'0%':fillWidth) + '"></div></div>' +
      '<div class="rail-tick ' + state + '"></div>' +
      '<div class="rail-label ' + (state==='current'?'current':'') + '">' + escapeHtml(s.code || s.id) + '</div>' +
      '</div>';
  }).join('');
}

function renderSection(){
  const section = SCHEMA.sections[currentSectionIndex];
  const panel = document.getElementById('panel');
  let fieldsHtml = '';

  section.questions.forEach((q, qi) => {
    const delay = (qi * 0.06).toFixed(2);
    if(section.type === 'likert'){
      fieldsHtml += renderLikertField(q, delay, section.scaleLabels);
    } else if(q.type === 'select'){
      fieldsHtml += renderSelectField(q, delay);
    } else if(q.type === 'multiselect'){
      fieldsHtml += renderMultiselectField(q, delay);
    } else if(q.type === 'number'){
      fieldsHtml += renderNumberField(q, delay);
    } else {
      fieldsHtml += renderTextField(q, delay);
    }
  });

  const isFirst = currentSectionIndex === 0;
  const isLast = currentSectionIndex === SCHEMA.sections.length - 1;

  panel.innerHTML =
    '<div class="section-code">Section ' + escapeHtml(section.id) + (section.code && section.code !== section.id ? ' — ' + escapeHtml(section.code) : '') + '</div>' +
    '<div class="section-title">' + escapeHtml(section.title) + '</div>' +
    fieldsHtml +
    '<div class="nav-row">' +
      '<button class="ghost" id="backBtn" ' + (isFirst ? 'disabled' : '') + '>Back</button>' +
      '<button class="primary" id="nextBtn">' + (isLast ? 'Submit' : 'Continue') + '</button>' +
    '</div>';

  document.getElementById('backBtn').onclick = goBack;
  document.getElementById('nextBtn').onclick = isLast ? handleSubmit : goNext;

  attachFieldHandlers(section);
}

function renderLikertField(q, delay, scaleLabels){
  const val = answers[q.id];
  let opts = '';
  for(let n=1;n<=5;n++){
    opts += '<div class="likert-opt ' + (val===n?'active':'') + '" data-qid="' + q.id + '" data-val="' + n + '">' +
      '<span class="likert-num">' + n + '</span><span class="likert-dot"></span></div>';
  }
  return '<div class="field" style="animation-delay:' + delay + 's">' +
    '<div class="field-label"><span class="qid">' + q.id + '</span>' + escapeHtml(q.label) + '</div>' +
    '<div class="likert-row">' + opts + '</div>' +
    (scaleLabels ? '<div class="likert-scale-labels"><span>' + escapeHtml(scaleLabels[0]) + '</span><span>' + escapeHtml(scaleLabels[scaleLabels.length-1]) + '</span></div>' : '') +
    '</div>';
}

function renderSelectField(q, delay){
  const val = answers[q.id] || '';
  const opts = q.options.map(o => '<option value="' + escapeHtml(o) + '" ' + (val===o?'selected':'') + '>' + escapeHtml(o) + '</option>').join('');
  return '<div class="field" style="animation-delay:' + delay + 's">' +
    '<div class="field-label"><span class="qid">' + q.id + '</span>' + escapeHtml(q.label) + '</div>' +
    '<select data-qid="' + q.id + '"><option value="">Select…</option>' + opts + '</select></div>';
}

function renderMultiselectField(q, delay){
  const val = answers[q.id] || [];
  const pills = q.options.map(o => '<div class="check-pill ' + (val.indexOf(o)>-1?'active':'') + '" data-qid="' + q.id + '" data-val="' + escapeHtml(o) + '">' + escapeHtml(o) + '</div>').join('');
  return '<div class="field" style="animation-delay:' + delay + 's">' +
    '<div class="field-label"><span class="qid">' + q.id + '</span>' + escapeHtml(q.label) + '</div>' +
    '<div class="check-row">' + pills + '</div></div>';
}

function renderNumberField(q, delay){
  const val = answers[q.id] || '';
  return '<div class="field" style="animation-delay:' + delay + 's">' +
    '<div class="field-label"><span class="qid">' + q.id + '</span>' + escapeHtml(q.label) + '</div>' +
    '<input type="number" min="0" data-qid="' + q.id + '" value="' + escapeHtml(String(val)) + '"></div>';
}

function renderTextField(q, delay){
  const val = answers[q.id] || '';
  return '<div class="field" style="animation-delay:' + delay + 's">' +
    '<div class="field-label"><span class="qid">' + q.id + '</span>' + escapeHtml(q.label) + '</div>' +
    '<input type="text" data-qid="' + q.id + '" value="' + escapeHtml(String(val)) + '"></div>';
}

function attachFieldHandlers(section){
  document.querySelectorAll('.likert-opt').forEach(el => {
    el.addEventListener('click', () => {
      const qid = el.getAttribute('data-qid');
      const v = parseInt(el.getAttribute('data-val'), 10);
      answers[qid] = v;
      document.querySelectorAll('.likert-opt[data-qid="' + qid + '"]').forEach(o => o.classList.remove('active'));
      el.classList.add('active');
    });
  });
  document.querySelectorAll('select[data-qid]').forEach(el => {
    el.addEventListener('change', () => { answers[el.getAttribute('data-qid')] = el.value; });
  });
  document.querySelectorAll('input[type=number][data-qid]').forEach(el => {
    el.addEventListener('input', () => { answers[el.getAttribute('data-qid')] = el.value; });
  });
  document.querySelectorAll('input[type=text][data-qid]').forEach(el => {
    el.addEventListener('input', () => { answers[el.getAttribute('data-qid')] = el.value; });
  });
  document.querySelectorAll('.check-pill').forEach(el => {
    el.addEventListener('click', () => {
      const qid = el.getAttribute('data-qid');
      const val = el.getAttribute('data-val');
      if(!answers[qid]) answers[qid] = [];
      const idx = answers[qid].indexOf(val);
      if(idx > -1){ answers[qid].splice(idx,1); el.classList.remove('active'); }
      else { answers[qid].push(val); el.classList.add('active'); }
    });
  });
}

function goNext(){
  if(currentSectionIndex < SCHEMA.sections.length - 1){
    currentSectionIndex++;
    renderRail();
    renderSection();
    window.scrollTo({top:0, behavior:'smooth'});
  }
}
function goBack(){
  if(currentSectionIndex > 0){
    currentSectionIndex--;
    renderRail();
    renderSection();
    window.scrollTo({top:0, behavior:'smooth'});
  }
}

function handleSubmit(){
  const btn = document.getElementById('nextBtn');
  btn.disabled = true;
  btn.textContent = 'Submitting…';
  google.script.run
    .withSuccessHandler(onSubmitSuccess)
    .withFailureHandler(onSubmitError)
    .submitResponse(SCHEMA.id, answers);
}

function onSubmitSuccess(){
  document.getElementById('app').innerHTML =
    '<div class="done-screen">' +
    '<div class="done-mark"><svg width="26" height="26" viewBox="0 0 24 24" fill="none"><path d="M4 12.5L9.5 18L20 6" stroke="#2F7D5C" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg></div>' +
    '<div class="done-title">Response recorded</div>' +
    '<div class="done-sub">Thank you for contributing to this study. Your response has been submitted anonymously.</div>' +
    '</div>';
}

function onSubmitError(err){
  const btn = document.getElementById('nextBtn');
  if(btn){ btn.disabled = false; btn.textContent = 'Submit'; }
  alert('Could not submit right now. Please try again.\\n' + (err && err.message ? err.message : ''));
}

function escapeHtml(str){
  return String(str == null ? '' : str)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

boot();
</script>

</body>
</html>
